apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: blue-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
      version: green
  template:
    metadata:
      labels:
        app: demo-app
        version: green
    spec:
      containers:
        - name: app
          image: mromanets/hello-gitops:latest
          ports:
            - containerPort: 8050
          readinessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 5
            periodSeconds: 5